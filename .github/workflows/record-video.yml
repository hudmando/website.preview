name: Record site walkthrough

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Run recorder
        run: node record.js
        continue-on-error: true
        id: recorder

      - name: Commit diagnostic log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f run-status.txt
          git diff --cached --quiet || git commit -m "Record run status [skip ci]"
          git push

      - name: Fail job if recorder failed
        if: steps.recorder.outcome == 'failure'
        run: exit 1

      - name: Convert to mp4
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cd videos
          for f in *.webm; do
            ffmpeg -i "$f" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "${f%.webm}.mp4"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: site-walkthrough-video
          path: videos/*.mp4

